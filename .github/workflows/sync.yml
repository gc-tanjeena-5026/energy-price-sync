name: JEPX Energy Price Sync

on:
  schedule:
    # 17:00 JST is 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger testing

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Ingestion Script
        env:
          MAIRA_API_KEY: ${{ secrets.API_KEY }}
          MAIRA_PROJECT_KEY: ${{ secrets.PROJECT_KEY }}
        run: python push_to_maira.py
